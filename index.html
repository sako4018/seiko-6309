<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive 3D digital twin of a vintage Seiko 5 6309-8060 with its automatic 6309 movement." />
    <title>Seiko 6309 Lab</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23e9dfc6' stroke='%23c8a45c' stroke-width='3'/%3E%3Cpath d='M16 16V7M16 16l6 3' stroke='%23222' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body data-mode="WATCH">
    <canvas id="scene" aria-label="3D view of the watch"></canvas>

    <header class="topbar">
      <div class="brand">
        <span class="model">SEIKO 6309-8060</span>
        <span class="lab">The Watchmaker's Lab</span>
      </div>
      <nav id="tabs" aria-label="Modes"></nav>
      <div class="top-right">
        <div id="hud">
          <span data-live="time"></span>
          <span class="sep">·</span>
          <span data-live="day"></span>&nbsp;<span data-live="date"></span>
        </div>
        <button class="btn ghost" data-refs="open">References</button>
      </div>
    </header>

    <aside id="panel-left" class="panel"></aside>
    <aside id="panel-info" class="panel"></aside>

    <div class="bottom">
      <div id="energy" aria-label="Energy path"></div>
      <div id="camera-bar">
        <button class="btn" data-act="preset" data-arg="front">Front</button>
        <button class="btn" data-act="preset" data-arg="side">Side</button>
        <button class="btn" data-act="preset" data-arg="rear">Rear</button>
        <button class="btn" data-act="focus">Close-up</button>
        <button class="btn" data-act="preset" data-arg="reset">Reset view</button>
      </div>
    </div>

    <div id="refs"></div>
    <div class="no-webgl-msg">This page needs WebGL. Try a current version of Safari, Chrome or Firefox.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
